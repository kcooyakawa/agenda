<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda Flashback · PUMP THE JAM</title>
<meta name="description" content="Calendário de festas flashback, anos 80, 90 e 2000 e dance music em São Paulo e no interior.">
<style>
:root{--bg:#0b0b0d;--card:#141418;--line:#2a2a30;--fg:#f4f1ea;--mute:#9a978f;--pink:#ff2e88;--cyan:#00e5ff;--yel:#ffe600}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1040px;margin:0 auto;padding:32px 16px 64px}
header{text-align:center;margin-bottom:24px}
h1{font-size:clamp(28px,6vw,52px);letter-spacing:.04em;line-height:1;
   background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;color:transparent}
.sub{color:var(--mute);margin-top:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.bar button,.bar a{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;
   padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none}
.bar .on{border-color:var(--pink);color:var(--pink)}
.mes{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.mes h2{font-size:22px;text-transform:uppercase;letter-spacing:.12em}
.mes button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{color:var(--mute);font-size:11px;text-align:center;text-transform:uppercase;padding:4px}
.dia{min-height:86px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px}
.dia.vazio{background:transparent;border:none}
.dia.hoje{border-color:var(--cyan)}
.dia .n{color:var(--mute);font-weight:700}
.dia .ev{display:block;margin-top:4px;background:var(--pink);color:#000;border-radius:6px;padding:2px 5px;
   font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.dia .ev.show{background:var(--yel)}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--fg);transition:.15s}
.card:hover{border-color:var(--pink);transform:translateY(-2px)}
.card .img{aspect-ratio:16/9;background:linear-gradient(135deg,#2b0f3a,#0d2b3a) center/cover;position:relative}
.card .data{position:absolute;left:10px;top:10px;background:#000c;border-radius:10px;padding:6px 10px;text-align:center;line-height:1}
.card .data b{display:block;font-size:22px;color:var(--cyan)}
.card .data span{font-size:11px;text-transform:uppercase}
.card .tx{padding:12px 14px}
.card h3{font-size:16px;margin-bottom:4px}
.card p{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-top:8px}
.vazio-msg{text-align:center;color:var(--mute);padding:40px}
.cta{display:block;text-align:center;margin-top:32px;padding:16px;border:1px dashed var(--pink);border-radius:16px;color:var(--pink);text-decoration:none}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:28px}
@media(max-width:640px){.dia{min-height:58px;padding:4px}.dia .ev{font-size:0;height:8px;padding:0}}
</style>
</head>
<body>
<main>
<header>
  <h1>AGENDA FLASHBACK</h1>
  <p class="sub">Festas anos 80, 90 e 2000 e dance music · São Paulo e interior</p>
</header>

<div class="bar" id="filtros"></div>

<div class="mes"><button id="ant" aria-label="Mês anterior">‹</button><h2 id="titulo"></h2><button id="prox" aria-label="Próximo mês">›</button></div>
<div class="cal" id="cal"></div>

<div class="lista" id="lista"></div>

<a class="cta" id="cta" href="https://wa.me/5511996535565?text=Oi%21+Quero+colocar+minha+festa+na+Agenda+Flashback+PUMP+THE+JAM.+Nome%3A+...+Data%3A+...+Cidade%3A+...+Link%3A+...">
  Produz festa flashback, show ou baile? Coloque na agenda →</a>
<div class="bar"><a id="ics" href="agenda.ics">📅 Assinar no Google Agenda / iPhone</a>
  <a id="loja" href="https://pumpthejam.com.br/collections/all">Camisetas PUMP THE JAM</a></div>

<footer>PUMP THE JAM · atualizado em 22/11/2026 03:58</footer>
</main>
<script>
const EVS = [{"nome": "Túnel do Tempo · anos 80 90 e 2000", "inicio": "2026-11-24T20:00", "local": "UNIP Ribeirão Preto", "cidade": "Ribeirão Preto", "url": "https://www.sympla.com.br/evento/tunel-do-tempo-anos-80-90-2000/3639639", "imagem": "", "fonte": "manual", "tipo": "show", "manual": true, "link": "https://www.sympla.com.br/evento/tunel-do-tempo-anos-80-90-2000/3639639?utm_source=pumpthejam&utm_medium=agenda&utm_campaign=agenda_flashback&utm_content=t-nel-do-tempo-anos-80-90-e-2000"}, {"nome": "Pra Sempre Cringe · anos 80 90 e 00", "inicio": "2026-12-12T21:00", "local": "Zoom Music Hall", "cidade": "São Carlos", "url": "https://www.sympla.com.br/evento/pra-sempre-cringe-sao-carlos-sp/3635982", "imagem": "", "fonte": "manual", "tipo": "festa", "manual": true, "link": "https://www.sympla.com.br/evento/pra-sempre-cringe-sao-carlos-sp/3635982?utm_source=pumpthejam&utm_medium=agenda&utm_campaign=agenda_flashback&utm_content=pra-sempre-cringe-anos-80-90-e-00"}];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const q=new URLSearchParams(location.search);
const SRC=q.get("utm_source")||"agenda", MED=q.get("utm_medium")||"agenda_page";
// links próprios da marca herdam a origem de quem chegou
const loja=new URL(document.getElementById("loja").href);
loja.search=new URLSearchParams({utm_source:SRC,utm_medium:MED,utm_campaign:"agenda_flashback",utm_content:"camisetas"});
document.getElementById("loja").href=loja;
let cidade="todas", hoje=new Date(), ref=new Date(hoje.getFullYear(),hoje.getMonth(),1);

const cidades=["todas",...new Set(EVS.map(e=>e.cidade).filter(Boolean))];
const fb=document.getElementById("filtros");
cidades.forEach(c=>{const b=document.createElement("button");b.textContent=c==="todas"?"Todas as cidades":c;
  b.onclick=()=>{cidade=c;render()};b.dataset.c=c;fb.appendChild(b)});

const filtrados=()=>EVS.filter(e=>cidade==="todas"||e.cidade===cidade);
const dataDe=e=>new Date(e.inicio.slice(0,10)+"T12:00");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function track(e){try{window.fbq&&fbq("trackCustom","AgendaClick",{festa:e.nome,cidade:e.cidade});
  window.gtag&&gtag("event","agenda_click",{festa:e.nome,cidade:e.cidade})}catch(_){}}

function render(){
  fb.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.c===cidade));
  const evs=filtrados(), y=ref.getFullYear(), m=ref.getMonth();
  document.getElementById("titulo").textContent=MESES[m]+" "+y;
  const cal=document.getElementById("cal"); cal.innerHTML="";
  ["dom","seg","ter","qua","qui","sex","sáb"].forEach(d=>cal.insertAdjacentHTML("beforeend",`<div class="dow">${d}</div>`));
  const ini=new Date(y,m,1).getDay(), dias=new Date(y,m+1,0).getDate();
  for(let i=0;i<ini;i++) cal.insertAdjacentHTML("beforeend",'<div class="dia vazio"></div>');
  for(let d=1;d<=dias;d++){
    const doDia=evs.filter(e=>{const x=dataDe(e);return x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d});
    const eHoje=d===hoje.getDate()&&m===hoje.getMonth()&&y===hoje.getFullYear();
    cal.insertAdjacentHTML("beforeend",`<div class="dia${eHoje?" hoje":""}"><span class="n">${d}</span>${
      doDia.map(e=>`<a class="ev${e.tipo==="show"?" show":""}" href="${esc(e.link)}" target="_blank" rel="noopener" title="${esc(e.nome)}">${esc(e.nome)}</a>`).join("")}</div>`);
  }
  const lista=document.getElementById("lista"); lista.innerHTML="";
  if(!evs.length){lista.innerHTML='<p class="vazio-msg">Nenhuma festa nesta cidade por enquanto.</p>';}
  evs.forEach(e=>{
    const x=dataDe(e), hora=e.inicio.slice(11,16);
    const a=document.createElement("a"); a.className="card"; a.href=e.link; a.target="_blank"; a.rel="noopener";
    a.innerHTML=`<div class="img" style="${e.imagem?`background-image:url('${esc(e.imagem)}')`:""}">
      <div class="data"><b>${x.getDate()}</b><span>${MESES[x.getMonth()].slice(0,3)}</span></div></div>
      <div class="tx"><h3>${esc(e.nome)}</h3><p>${esc(e.local)}${e.local&&e.cidade?" · ":""}${esc(e.cidade)}${hora?" · "+hora:""}</p>
      <span class="tag">${e.tipo==="show"?"show":"festa"}</span></div>`;
    a.onclick=()=>track(e); lista.appendChild(a);
  });
}
document.getElementById("ant").onclick=()=>{ref.setMonth(ref.getMonth()-1);render()};
document.getElementById("prox").onclick=()=>{ref.setMonth(ref.getMonth()+1);render()};
render();
</script>
</body>
</html>
