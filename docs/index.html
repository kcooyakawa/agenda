.dia .ev.show{background:var(--yel)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--fg);transition:.15s}
.card:hover{border-color:var(--pink);transform:translateY(-2px)}
.card .img{aspect-ratio:16/9;background:linear-gradient(135deg,#2b0f3a,#0d2b3a) center/cover;position:relative}
.card .data{position:absolute;left:10px;top:10px;background:#000c;border-radius:10px;padding:6px 10px;text-align:center;line-height:1}
.card .data b{display:block;font-size:22px;color:var(--cyan)}
.card .data span{font-size:11px;text-transform:uppercase}
.card .tx{padding:12px 14px}
.card h3{font-size:16px;margin-bottom:4px}
.card p{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-top:8px}
.vazio-msg{text-align:center;color:var(--mute);padding:40px}
.cta{display:block;text-align:center;margin-top:32px;padding:16px;border:1px dashed var(--pink);border-radius:16px;color:var(--pink);text-decoration:none}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:28px}

const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const q=new URLSearchParams(location.search);
const SRC=q.get("utm_source")||"agenda", MED=q.get("utm_medium")||"agenda_page";
// links próprios da marca herdam a origem de quem chegou
const loja=new URL(document.getElementById("loja").href);
loja.search=new URLSearchParams({utm_source:SRC,utm_medium:MED,utm_campaign:"agenda_flashback",utm_content:"camisetas"});
document.getElementById("loja").href=loja;
let cidade="todas", hoje=new Date(), ref=new Date(hoje.getFullYear(),hoje.getMonth(),1);

const cidades=["todas",...new Set(EVS.map(e=>e.cidade).filter(Boolean))];
const fb=document.getElementById("filtros");
cidades.forEach(c=>{const b=document.createElement("button");b.textContent=c==="todas"?"Todas as cidades":c;
  b.onclick=()=>{cidade=c;render()};b.dataset.c=c;fb.appendChild(b)});

const filtrados=()=>EVS.filter(e=>cidade==="todas"||e.cidade===cidade);
const dataDe=e=>new Date(e.inicio.slice(0,10)+"T12:00");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function track(e){try{window.fbq&&fbq("trackCustom","AgendaClick",{festa:e.nome,cidade:e.cidade});
  window.gtag&&gtag("event","agenda_click",{festa:e.nome,cidade:e.cidade})}catch(_){}}

function render(){
  fb.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.c===cidade));
  const evs=filtrados(), y=ref.getFullYear(), m=ref.getMonth();
  document.getElementById("titulo").textContent=MESES[m]+" "+y;
  const cal=document.getElementById("cal"); cal.innerHTML="";
  ["dom","seg","ter","qua","qui","sex","sáb"].forEach(d=>cal.insertAdjacentHTML("beforeend",`<div class="dow">${d}</div>`));
  const ini=new Date(y,m,1).getDay(), dias=new Date(y,m+1,0).getDate();
  for(let i=0;i<ini;i++) cal.insertAdjacentHTML("beforeend",'<div class="dia vazio"></div>');
  for(let d=1;d<=dias;d++){
    const doDia=evs.filter(e=>{const x=dataDe(e);return x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d});
    const eHoje=d===hoje.getDate()&&m===hoje.getMonth()&&y===hoje.getFullYear();
    cal.insertAdjacentHTML("beforeend",`<div class="dia${eHoje?" hoje":""}"><span class="n">${d}</span>${
      doDia.map(e=>`<a class="ev${e.tipo==="show"?" show":""}" href="${esc(e.link)}" target="_blank" rel="noopener" title="${esc(e.nome)}">${esc(e.nome)}</a>`).join("")}</div>`);
  }
  const lista=document.getElementById("lista"); lista.innerHTML="";
  if(!evs.length){lista.innerHTML='<p class="vazio-msg">Nenhuma festa nesta cidade por enquanto.</p>';}
  evs.forEach(e=>{
    const x=dataDe(e), hora=e.inicio.slice(11,16);
    const a=document.createElement("a"); a.className="card"; a.href=e.link; a.target="_blank"; a.rel="noopener";
    a.innerHTML=`<div class="img" style="${e.imagem?`background-image:url('${esc(e.imagem)}')`:""}">
      <div class="data"><b>${x.getDate()}</b><span>${MESES[x.getMonth()].slice(0,3)}</span></div></div>
      <div class="tx"><h3>${esc(e.nome)}</h3><p>${esc(e.local)}${e.local&&e.cidade?" · ":""}${esc(e.cidade)}${hora?" · "+hora:""}</p>
      <span class="tag">${e.tipo==="show"?"show":"festa"}</span></div>`;
    a.onclick=()=>track(e); lista.appendChild(a);
  });
}
document.getElementById("ant").onclick=()=>{ref.setMonth(ref.getMonth()-1);render()};
document.getElementById("prox").onclick=()=>{ref.setMonth(ref.getMonth()+1);render()};
render();
</script>
