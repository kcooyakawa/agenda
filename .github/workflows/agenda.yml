# Roda o robô todo dia às 6h (horário de Brasília) nos servidores do GitHub,
# mesmo com o Mac desligado. Grátis em repositório público.
name: Agenda flashback
on:
  schedule: [{cron: "0 9 * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python robo.py
      - run: |
          git config user.name "robo-ptj"; git config user.email "pumpthejamwear@gmail.com"
          git add docs && git commit -m "agenda atualizada" || echo "sem mudanças"
          git push
